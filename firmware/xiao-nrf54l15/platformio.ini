; Talking Dog collar — Seeed XIAO nRF54L15 (Zephyr RTOS via Seeed's PlatformIO platform)
;
;   pio run -e collar            build (mic off — regular XIAO nRF54L15, no onboard mic)
;   pio run -e collar-sense      build with onboard PDM mic streaming (XIAO nRF54L15 Sense)
;   pio run -e collar -t upload  flash over the on-board CMSIS-DAP (USB-C)
;   pio device monitor           serial log at 115200
;
; First build downloads the Zephyr toolchain + framework (several minutes, ~2 GB).

[platformio]
default_envs = collar-sense

[base]
platform = https://github.com/Seeed-Studio/platform-seeedboards.git
framework = zephyr
board = seeed-xiao-nrf54l15
monitor_speed = 115200

[env:collar]
extends = base
build_flags = -DCOLLAR_MIC=0

[env:collar-sense]
extends = base
build_flags = -DCOLLAR_MIC=1
